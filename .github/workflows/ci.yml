name: Archon-V Security & Test CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-tests:
    name: SAST, Quality & Hermetic Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov bandit ruff

      - name: Run Bandit Security Analysis (SAST)
        run: |
          bandit -r core/ api/ -ll -ii

      - name: Run Unit Test Suite
        env:
          PYTHONPATH: .
        run: |
          pytest tests/unit -v --durations=10

